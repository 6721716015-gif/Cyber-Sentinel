            theme: {
                extend: {
                    fontFamily: { sans: ['Mitr', 'sans-serif'] },
                    colors: {
                        cyber: {
                            dark: '#0a0a0f',

                            neon: '#00f0ff',
                            pink: '#ff003c',
                            green: '#00ff66',
                            alert: '#ff3333'

                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glitch': 'glitch 1s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },

            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);

                        <p class="text-xl text-gray-300 mb-8 max-w-md">"ไฟล์ทั้งหมดของคุณถูกเข้ารหัส ส่ง Bitcoin มาเดี๋ยวนี้!"</p>
                        
                        <p class="text-sm text-gray-400 mb-6">วิธีที่ดีที่สุดในการรับมือ Ransomware คือการมีระบบสำรองข้อมูล (Backup)</p>

                        <button onclick="handleAnswer(true, 'รอดพ้นวิกฤต! การมีระบบ Backup สม่ำเสมอและอัปเดตระบบป้องกันคือเกราะที่ดีที่สุดจาก Ransomware')" class="cyber-btn bg-blue-900/40 border-4 border-blue-500 rounded-full w-56 h-56 flex flex-col items-center justify-center shadow-[0_0_40px_rgba(59,130,246,0.6)] hover:bg-blue-600/50 hover:scale-110 transition-all z-10">
                            <span class="text-7xl mb-2">🛡️</span>
                            <span class="font-bold text-xl text-white">เปิดระบบ Backup</span>
                        </button>
                    </div>
                `
            }
        ];

        // Functions
        function startGame() {
            playSound('click');
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            isGameActive = true;
            score = 0;
            updateScore(0);
            loadLevel(1);
        }

        function loadLevel(levelNum) {
            currentLevel = levelNum;
            document.getElementById('ui-level').innerText = levelNum;
            const container = document.getElementById('level-container');
            
            // Clear previous game loops if any
            gameLoopActive = false;
            clearInterval(virusInterval);
            
            // Fade in effect
            container.style.opacity = 0;
            container.innerHTML = levels[levelNum - 1].render();
            
            setTimeout(() => {
                container.style.transition = 'opacity 0.5s';
                container.style.opacity = 1;
            }, 50);
        }

        function updateScore(points) {
            score += points;
            const scoreEl = document.getElementById('ui-score');
            scoreEl.innerText = score;
            
            if(points > 0) {
                scoreEl.classList.add('scale-150', 'text-white');
                setTimeout(() => scoreEl.classList.remove('scale-150', 'text-white'), 300);
            }
        }

        function handleAnswer(isCorrect, feedbackMsg) {
            if(!isGameActive) return;
            playSound('click');
            
            // Disable buttons to prevent spam
            document.querySelectorAll('button').forEach(btn => btn.style.pointerEvents = 'none');

            const overlay = document.getElementById('feedback-overlay');
            const box = document.getElementById('feedback-box');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const desc = document.getElementById('feedback-desc');
            const retryContainer = document.getElementById('retry-container');

            overlay.classList.remove('hidden');

            if (isCorrect) {
                playSound('correct');
                updateScore(100);
                box.className = 'glass-panel text-center p-8 rounded-2xl transform transition-transform duration-300 scale-100 border-2 border-cyber-green glow-green w-11/12 max-w-md';
                icon.innerText = '✅';
                title.innerText = 'ระบบปลอดภัย!';
                title.className = 'text-4xl font-bold mb-4 text-cyber-green';
                retryContainer.classList.add('hidden'); // ซ่อนปุ่มเล่นใหม่ถ้าตอบถูก
            } else {
                playSound('wrong');
                box.className = 'glass-panel text-center p-8 rounded-2xl transform transition-transform duration-300 scale-100 border-2 border-cyber-alert glow-pink w-11/12 max-w-md bg-red-950/40';
                icon.innerText = '❌';
                title.innerText = 'ระบบถูกเจาะ!';
                title.className = 'text-4xl font-bold mb-4 text-cyber-alert animate-glitch';
                retryContainer.classList.remove('hidden'); // แสดงปุ่มเล่นใหม่เมื่อตอบผิด
            }
            
            desc.innerText = feedbackMsg;

            // Fade in
            setTimeout(() => overlay.classList.add('opacity-100'), 10);

            if (isCorrect) {
                // ข้ามไปด่านต่อไปอัตโนมัติเฉพาะเมื่อตอบถูกเท่านั้น
                setTimeout(() => {
                    overlay.classList.remove('opacity-100');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        if (currentLevel < levels.length) {
                            loadLevel(currentLevel + 1);
                        } else {
                            showEndScreen();
                        }
                    }, 300); // wait for fade out
                }, 3500); // show feedback for 3.5s
            }
        }

        function retryLevel() {
            playSound('click');
            const overlay = document.getElementById('feedback-overlay');
            
            // เฟดหน้าต่างแจ้งเตือนออก
            overlay.classList.remove('opacity-100');
            setTimeout(() => {
                overlay.classList.add('hidden');
                
                // เปิดใช้งานปุ่มทั้งหมดอีกครั้ง
                document.querySelectorAll('button').forEach(btn => btn.style.pointerEvents = 'auto');
                
                // โหลดด่านปัจจุบันขึ้นมาให้เล่นใหม่
                loadLevel(currentLevel);
            }, 300);
        }

        // Minigame Logic (Level 4)
        function startMinigame() {
            gameLoopActive = true;
            virusKilled = 0;
            virusSpawned = 0;
            const area = document.getElementById('game-area');
            const counter = document.getElementById('virus-counter');
            if(!area) return;

            // Spawn loop
            virusInterval = setInterval(() => {
                if(!gameLoopActive) {
                    clearInterval(virusInterval);
                    return;
                }
                
                if (virusSpawned >= VIRUS_TARGET * 1.5) {
                    // if spawned too many and player missed too many
                    if (virusKilled < VIRUS_TARGET) {
                        gameLoopActive = false;
                        handleAnswer(false, 'คุณทำลายไวรัสไม่ทัน! ระบบถูกมัลแวร์โจมตี ควรติดตั้งและอัปเดต Antivirus สม่ำเสมอ');
                    }
                    clearInterval(virusInterval);
                    return;
                }

                createVirus(area, counter);
                virusSpawned++;
                
            }, 800); // spawn every 0.8s
        }

        function createVirus(area, counter) {
            const v = document.createElement('div');
            const types = ['👾', '🦠', '🐞'];
            v.innerText = types[Math.floor(Math.random() * types.length)];
            v.className = 'virus-entity text-4xl filter drop-shadow-[0_0_8px_#ff003c]';
            
            // Random start position X (10% to 90%)
            v.style.left = (Math.random() * 80 + 10) + '%';
            v.style.top = '-50px';
            
            area.appendChild(v);
            
            let pos = -50;
            let speed = 2 + Math.random() * 2; // speed 2 to 4
            
            // Fall animation loop
            const fall = setInterval(() => {
                if(!gameLoopActive) {
                    clearInterval(fall);
                    v.remove();
                    return;
                }
                
                pos += speed;
                v.style.top = pos + 'px';
                
                // If hits bottom
                if (pos > area.offsetHeight - 40) {
                    clearInterval(fall);
                    v.remove();
                    // Optional: deduct points or visual penalty, but to keep it simple, we just let it pass.
                    // The fail condition is handled by the spawn interval checking spawned vs killed.
                }
            }, 20);

            // Click to kill
            v.onmousedown = v.ontouchstart = function(e) {
                e.preventDefault(); // prevent double firing on touch
                if(!gameLoopActive) return;
                playSound('shoot');
                clearInterval(fall);
                this.innerText = '💥';
                this.className = 'virus-entity text-5xl filter drop-shadow-[0_0_15px_#00ff66] text-cyber-green transition-all duration-200 scale-150 opacity-0';
                
                virusKilled++;
                counter.innerText = Math.min(virusKilled, VIRUS_TARGET);
                
                setTimeout(() => this.remove(), 200);

                if (virusKilled >= VIRUS_TARGET) {
                    gameLoopActive = false;
                    setTimeout(() => {
                        handleAnswer(true, 'การตอบสนองยอดเยี่ยม! คุณบล็อกมัลแวร์ได้หมดจด');
                    }, 500);
                }
            };
        }

        function showEndScreen() {
            isGameActive = false;
            document.getElementById('game-ui').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            document.getElementById('final-score').innerText = score;
            
            let evalText = "";
            let evalColor = "";
            if (score === 500) {
                evalText = "สุดยอดผู้พิทักษ์ (Cyber Master) 🌟\nความรู้ของคุณแน่นตึ้บ ไม่มีแฮกเกอร์คนไหนเจาะระบบคุณได้!";
                evalColor = "text-cyber-green";
            } else if (score >= 300) {
                evalText = "เจ้าหน้าที่ระดับกลาง (Cyber Defender) 👍\nคุณป้องกันพื้นฐานได้ดี แต่อาจต้องระวังกลลวงใหม่ๆ ให้มากขึ้น";
                evalColor = "text-yellow-400";
            } else {
                evalText = "ระบบมีความเสี่ยงสูง! (Vulnerable) ⚠️\nข้อมูลของคุณเสี่ยงถูกขโมย แนะนำให้ศึกษาเรื่อง Cyber Security เพิ่มเติมด่วน!";
                evalColor = "text-cyber-alert";
            }
            
            const evalDiv = document.getElementById('evaluation-text');
            evalDiv.innerText = evalText;
            evalDiv.className = `text-lg font-medium whitespace-pre-line mt-4 ${evalColor}`;
            
            endScreen.classList.remove('hidden');
            playSound('correct');
        }
    </script>
</body>
</html>
